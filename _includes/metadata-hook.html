<script>
document.addEventListener('DOMContentLoaded', function () {
  var links = document.querySelectorAll('a[href="/photography/"], a[href*="/photography/"]');
  links.forEach(function (link) {
    link.addEventListener('click', function (e) {
      var sidebar = document.getElementById('sidebar');
      if (!sidebar) return;
      e.preventDefault();
      var dest = link.href;
      sidebar.style.transition = 'transform 0.38s cubic-bezier(0.4, 0, 0.2, 1)';
      sidebar.style.transform = 'translateX(-110%)';
      setTimeout(function () { window.location.href = dest; }, 360);
    });
  });
});

window.addEventListener('pageshow', function (e) {
  if (e.persisted) {
    var sidebar = document.getElementById('sidebar');
    if (sidebar) {
      sidebar.style.transition = 'none';
      sidebar.style.transform = '';
    }
  }
});
</script>

<script>
/* Site-wide default Mermaid look. Individual diagrams can still override any
   of these by adding a `%%{init: {'themeVariables': {...}}}%%` directive as
   the first line of their own ```mermaid block — that merges over these
   defaults for that one diagram only. */
function applyGlobalMermaidTheme() {
  if (typeof mermaid === 'undefined' || typeof mermaid.initialize !== 'function') return;

  var THEME_VARS = {
    light: {
      primaryColor: '#f8fafc',
      primaryBorderColor: '#FF6600',
      primaryTextColor: '#111827',
      lineColor: '#64748b',
      secondaryColor: '#f1f5f9',
      tertiaryColor: '#fff7ed',
      edgeLabelBackground: '#f1f5f9',
      fontFamily: 'Inter, -apple-system, sans-serif'
    },
    dark: {
      primaryColor: '#25262b',
      primaryBorderColor: '#fb923c',
      primaryTextColor: '#e5e7eb',
      lineColor: '#94a3b8',
      secondaryColor: '#2f3137',
      tertiaryColor: '#1e2030',
      edgeLabelBackground: '#2f3137',
      fontFamily: 'Inter, -apple-system, sans-serif'
    }
  };

  var mode = (window.Theme && Theme.visualState === 'dark') ? 'dark' : 'light';
  mermaid.initialize({ theme: 'base', themeVariables: THEME_VARS[mode] });

  /* Reset each visible diagram back to source and re-render it with our
     theme. Diagrams hidden inside a collapsed <details> are skipped here —
     collapsible.html's own toggle listener re-renders those (using whichever
     theme is active by then) the first time they're opened. */
  var mermaidEls = document.getElementsByClassName('mermaid');
  var toRender = [];
  Array.prototype.forEach.call(mermaidEls, function (el) {
    if (el.offsetParent === null) return;
    var original = el.previousSibling && el.previousSibling.children && el.previousSibling.children[0];
    if (original) el.textContent = original.textContent;
    el.removeAttribute('data-processed');
    toRender.push(el);
  });
  if (toRender.length) mermaid.init(null, toRender);
}

/* Initial paint: Chirpy already auto-rendered every diagram once (with its
   own default palette) before this runs, so re-render with our theme on top. */
window.addEventListener('load', applyGlobalMermaidTheme);

/* Chirpy re-renders every `.mermaid` diagram with its own default/dark preset
   whenever the OS-level color scheme flips (broadcast via a self-targeted
   `postMessage` carrying `Theme.ID`), which would otherwise stomp our custom
   theme right after the switch. Listen for the same broadcast and reapply
   ours; the `setTimeout` pushes our re-render after Chirpy's own same-event
   handler regardless of which of the two was registered first. */
window.addEventListener('message', function (e) {
  if (e.source === window && e.data && window.Theme && e.data.id === Theme.ID) {
    setTimeout(applyGlobalMermaidTheme, 0);
  }
});
</script>
