<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why IPA is rotation-invariant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --surface-1: #f8fafc; --border: rgba(15,23,42,0.10);
    --text-primary: #111827; --text-secondary: #64748b; --text-muted: #6e7684;
    --teal: #0f766e; --coral: #c2410c; --gray: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: rgb(27,27,30); --surface-1: #25262b; --border: rgba(148,163,184,0.14);
      --text-primary: #e5e7eb; --text-secondary: #94a3b8; --text-muted: #7d8694;
      --teal: #5eead4; --coral: #fdba8c; --gray: #94a3b8;
    }
  }
  body { background: var(--bg); color: var(--text-primary); font-family:'Inter',system-ui,sans-serif; padding: 24px 20px 32px; max-width: 720px; margin: 0 auto; }
  .visual { border: 0.5px solid var(--border); border-radius: 12px; background: var(--surface-1); padding: 16px; }
  .visual svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="visual"><svg viewBox="0 0 680 320" width="100%" style="max-width:640px">
<title>Why IPA is rotation-invariant</title>
<desc>Two residues each generate a point from their own local frame — a query point and a key point — and the model measures the distance between them. On the right, the entire protein is rotated 35 degrees: every frame rotates the same amount, so the query and key points end up rotated together too, and the distance between them stays exactly the same.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="180" y="40" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text-primary)" font-family="Inter,sans-serif">Original orientation</text>
<text x="540" y="40" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text-primary)" font-family="Inter,sans-serif">Rotated 35°</text>

<g transform="translate(180,180)">
  <circle cx="-40" cy="20" r="6" fill="var(--gray)"/>
  <circle cx="60" cy="-30" r="6" fill="var(--gray)"/>
  <line x1="-40" y1="20" x2="-15" y2="5" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="60" y1="-30" x2="40" y2="-15" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="-15" y1="5" x2="40" y2="-15" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="-15" cy="5" r="5" fill="var(--teal)"/>
  <circle cx="40" cy="-15" r="5" fill="var(--coral)"/>
  <text x="-80" y="32" font-size="11" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">res 1</text>
  <text x="68" y="-40" font-size="11" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">res 4</text>
  <text x="-8" y="20" font-size="11" fill="var(--teal)" font-family="'JetBrains Mono',monospace">Q</text>
  <text x="46" y="-22" font-size="11" fill="var(--coral)" font-family="'JetBrains Mono',monospace">K</text>
  <text x="15" y="-12" font-size="11" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace">d</text>
</g>

<g transform="translate(540,180) rotate(35)">
  <circle cx="-40" cy="20" r="6" fill="var(--gray)"/>
  <circle cx="60" cy="-30" r="6" fill="var(--gray)"/>
  <line x1="-40" y1="20" x2="-15" y2="5" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="60" y1="-30" x2="40" y2="-15" stroke="var(--text-muted)" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="-15" y1="5" x2="40" y2="-15" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="-15" cy="5" r="5" fill="var(--teal)"/>
  <circle cx="40" cy="-15" r="5" fill="var(--coral)"/>
</g>
<text x="460" y="180" font-size="11" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">res 1</text>
<text x="612" y="195" font-size="11" fill="var(--text-secondary)" font-family="'JetBrains Mono',monospace">res 4</text>
<text x="515" y="168" text-anchor="middle" font-size="11" fill="var(--teal)" font-family="'JetBrains Mono',monospace">Q</text>
<text x="590" y="200" font-size="11" fill="var(--coral)" font-family="'JetBrains Mono',monospace">K</text>
<text x="558" y="172" text-anchor="middle" font-size="11" fill="var(--text-muted)" font-family="'JetBrains Mono',monospace">d</text>

<rect x="90" y="240" width="180" height="40" rx="8" fill="var(--surface-1)" stroke="var(--border)" stroke-width="0.75"/>
<text x="180" y="264" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace">|Q − K| ≈ 58</text>
<rect x="450" y="240" width="180" height="40" rx="8" fill="var(--surface-1)" stroke="var(--border)" stroke-width="0.75"/>
<text x="540" y="264" text-anchor="middle" font-size="13" font-weight="500" fill="var(--text-primary)" font-family="'JetBrains Mono',monospace">|Q − K| ≈ 58</text>
</svg></div>
<script>
function sendHeight(){ window.parent.postMessage({ iframeHeight: document.documentElement.scrollHeight }, '*'); }
window.addEventListener('load', () => setTimeout(sendHeight, 150));
window.addEventListener('resize', sendHeight);
</script>
</body>
</html>
