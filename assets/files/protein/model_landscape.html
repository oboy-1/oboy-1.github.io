<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLM Model Landscape</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:#ffffff; --surface:#f8fafc; --surface-2:#f1f5f9;
    --border:rgba(15,23,42,0.09);
    --text-primary:#111827; --text-secondary:#64748b; --text-muted:#6e7684;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:rgb(27,27,30); --surface:#25262b; --surface-2:#2f3137;
      --border:rgba(148,163,184,0.11);
      --text-primary:#e5e7eb; --text-secondary:#94a3b8; --text-muted:#7d8694;
    }
  }

  body {
    background:var(--bg); color:var(--text-primary);
    font-family:'Inter',system-ui,sans-serif;
    padding:24px 20px 36px; transition:background 180ms ease;
  }

  .topbar { display:flex; align-items:center; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
  .topbar-label { font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-right:4px; }

  .gb-btn {
    font-size:12px; font-weight:500; padding:6px 16px;
    border-radius:99px; border:0.5px solid var(--border);
    background:var(--surface); color:var(--text-secondary);
    cursor:pointer; transition:all 0.15s; user-select:none;
  }
  .gb-btn:hover { border-color:var(--text-secondary); color:var(--text-primary); }
  .gb-btn.active { background:var(--text-primary); color:var(--bg); border-color:var(--text-primary); }

  /* section heads */
  .section-head {
    font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-muted); margin-bottom:10px; padding-bottom:8px;
    border-bottom:0.5px solid var(--border);
  }
  .section { margin-bottom:28px; }

  /* card grid container — relative so cards can be absolutely positioned during anim */
  .card-stage {
    position:relative; min-height:40px;
    display:flex; flex-wrap:wrap; gap:8px;
    transition:min-height 0.4s ease;
  }

  /* card */
  .card {
    background:var(--surface); border:0.5px solid var(--border);
    border-radius:var(--radius); padding:14px 16px;
    cursor:pointer; transition:border-color 0.12s, background 0.12s, box-shadow 0.12s;
    width:200px; flex-shrink:0; flex-grow:1; max-width:260px;
    will-change:transform;
  }
  .card:hover { border-color:var(--text-muted); }
  .card.active { border-color:var(--accent,#888); border-width:1px; background:var(--bg); box-shadow:0 2px 12px rgba(0,0,0,0.06); }
  .card.animating { position:absolute; pointer-events:none; z-index:10; }

  .card-name { font-size:13px; font-weight:500; color:var(--text-primary); margin-bottom:2px; }
  .card-meta { font-size:11px; color:var(--text-muted); margin-bottom:7px; }
  .card-oneliner { font-size:11px; color:var(--text-secondary); line-height:1.45; margin-bottom:8px; font-style:italic; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .tags { display:flex; flex-wrap:wrap; gap:4px; }
  .tag {
    display:inline-block; font-size:10px; font-weight:500;
    padding:2px 7px; border-radius:99px; border:0.5px solid; letter-spacing:0.02em;
  }
  .paper-link {
    font-size:10px; font-weight:500; color:var(--text-secondary); text-decoration:none;
    display:flex; align-items:center; gap:3px; flex-shrink:0;
    padding:2px 8px; border:0.5px solid var(--border); border-radius:99px;
    background:var(--surface-2);
    transition:color 0.1s, border-color 0.1s, background 0.1s;
  }
  .paper-link:hover { color:var(--text-primary); border-color:var(--text-muted); background:var(--bg); }

  /* snake timeline */
  .snake-wrap { position:relative; }
  .snake-row {
    display:grid; grid-template-columns:1fr 48px 1fr;
    align-items:start; margin-bottom:16px;
  }
  .snake-left  { grid-column:1; }
  .snake-right { grid-column:3; }
  .snake-mid   {
    grid-column:2; display:flex; flex-direction:column;
    align-items:center; padding-top:16px;
  }
  .snake-year {
    font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:500;
    color:var(--text-muted); letter-spacing:0.06em;
    background:var(--bg); padding:2px 0; z-index:1; text-align:center;
  }
  .snake-dot {
    width:10px; height:10px; border-radius:50%;
    border:2px solid var(--bg); margin:4px 0; flex-shrink:0; z-index:1;
  }
  .snake-line {
    width:1px; flex:1; background:var(--border); min-height:8px;
  }
  .snake-connector {
    width:100%; height:1px; background:var(--border);
    grid-column:1/-1; margin:0;
  }
  /* empty cell placeholder */
  .snake-empty { grid-column:1; visibility:hidden; }

  /* detail */
  .detail {
    margin-top:14px; background:var(--surface);
    border:0.5px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; display:none;
  }
  .detail.visible { display:block; }
  .d-eyebrow { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px; }
  .d-name { font-size:15px; font-weight:500; color:var(--text-primary); margin-bottom:4px; }
  .d-oneliner { font-size:13px; color:var(--text-secondary); font-style:italic; margin-bottom:10px; padding-bottom:10px; border-bottom:0.5px solid var(--border); }
  .d-body { font-size:13px; color:var(--text-secondary); line-height:1.65; }
  .d-insight { margin-top:10px; font-size:12px; color:var(--text-muted); border-left:2px solid var(--border); padding-left:10px; line-height:1.5; }
  .d-link {
    display:inline-block; margin-top:12px; font-size:11px; font-weight:500;
    color:var(--text-muted); text-decoration:none;
    padding:4px 10px; border:0.5px solid var(--border); border-radius:99px;
    transition:color 0.1s, border-color 0.1s;
  }
  .d-link:hover { color:var(--text-primary); border-color:var(--text-secondary); }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-label">Group by</span>
  <button class="gb-btn active" onclick="setView('problem')">Problem</button>
  <button class="gb-btn" onclick="setView('architecture')">Architecture</button>
  <button class="gb-btn" onclick="setView('timeline')">Timeline</button>
</div>

<div id="main"></div>

<div class="detail" id="detail">
  <div class="d-eyebrow" id="d-eyebrow"></div>
  <div class="d-name" id="d-name"></div>
  <div class="d-oneliner" id="d-oneliner"></div>
  <div class="d-body" id="d-body"></div>
  <div class="d-insight" id="d-insight"></div>
  <a class="d-link" id="d-link" target="_blank" rel="noopener">↗ Read the paper</a>
</div>

<script>
const dark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

const MODELS = [
  { key:'esm1b',       name:'ESM-1b',       year:2021, lab:'Meta / FAIR',       problem:'repr',   arch:'encoder',    arch_pill:'masked LM',
    oneliner:'Attention heads spontaneously learned 3D contacts from sequence alone.',
    body:'Trained on UniRef50 with masked language modeling. The landmark finding: attention heads learned to track which residues are in physical contact in 3D space, even though the model never saw a single structure during training.',
    insight:'First clear evidence that evolutionary statistics alone encode 3D structural information.',
    link:'https://www.pnas.org/doi/10.1073/pnas.2016239118' },
  { key:'esm2',        name:'ESM-2',        year:2023, lab:'Meta / FAIR',       problem:'repr',   arch:'encoder',    arch_pill:'masked LM · 8M–15B params',
    oneliner:'Scaled to 15B parameters; became the default embedding backbone.',
    body:'Scaled ESM-1b dramatically — same masked LM objective, refined training, larger data, sizes from 8M to 15B parameters. The current standard backbone when people say "use a PLM embedding."',
    insight:'Scaling worked, but with diminishing returns — 650M captures most of the signal.',
    link:'https://www.science.org/doi/10.1126/science.ade2574' },
  { key:'esmc',        name:'ESM C',        year:2024, lab:'EvolutionaryScale', problem:'repr',   arch:'encoder',    arch_pill:'repr-only · no generation',
    oneliner:'ESM-2 replacement with better contact precision and lower compute.',
    body:'Drop-in replacement for ESM-2, focused purely on representation quality. Major performance gains on contact prediction. Not generative — the Cambrian family is the representation counterpart to ESM3\'s generative family.',
    insight:'Current state of the art for sequence embeddings.',
    link:'https://evolutionaryscale.ai/blog/esm-cambrian' },
  { key:'af2',         name:'AlphaFold 2',  year:2021, lab:'DeepMind',          problem:'fold',   arch:'evoformer',  arch_pill:'Evoformer + IPA',
    oneliner:'Atomic-accuracy structure from sequence; effectively solved single-chain folding.',
    body:'Uses an Evoformer to process co-evolutionary signals from MSAs, then a Structure Module with Invariant Point Attention to output atomic coordinates. Won CASP14 by an enormous margin.',
    insight:'A genuine scientific breakthrough — decades of the protein folding problem, largely resolved.',
    link:'https://www.nature.com/articles/s41586-021-03819-2' },
  { key:'rosetta',     name:'RoseTTAFold',  year:2021, lab:'Baker lab',         problem:'fold',   arch:'encoder',    arch_pill:'three-track 1D/2D/3D',
    oneliner:'Three-track architecture jointly reasoning over sequence, distances, and 3D.',
    body:'Developed independently from AlphaFold2, reaching similar accuracy. Three-track architecture simultaneously processes 1D sequence, 2D inter-residue distances, and 3D coordinates.',
    insight:'The three-track idea directly inspired ESM3\'s multimodal design.',
    link:'https://www.science.org/doi/10.1126/science.abj8754' },
  { key:'esmfold',     name:'ESMFold',      year:2023, lab:'Meta / FAIR',       problem:'fold',   arch:'encoder',    arch_pill:'PLM embeds → fold head',
    oneliner:'No MSA needed; trades accuracy for speed, works on orphan proteins.',
    body:'Structure prediction from ESM-2 embeddings alone — no multiple sequence alignment required. Uses a modified AlphaFold2 structure module but fed PLM embeddings instead of co-evolutionary features.',
    insight:'For proteins with no known homologs, ESMFold is often the only option.',
    link:'https://www.science.org/doi/10.1126/science.ade2574' },
  { key:'af3',         name:'AlphaFold 3',  year:2024, lab:'Google DeepMind',   problem:'fold',   arch:'evoformer',  arch_pill:'Evoformer + diffusion head',
    oneliner:'Extended to complexes and ligands; replaced structure module with diffusion.',
    body:'Extends structure prediction to protein-protein complexes, protein-DNA, protein-RNA, and protein-small molecule interactions. Replaces the Structure Module with a diffusion model.',
    insight:'Moving from "what shape is this protein" to "how does it interact with everything else in the cell."',
    link:'https://www.nature.com/articles/s41586-024-07487-w' },
  { key:'proteinmpnn', name:'ProteinMPNN',  year:2022, lab:'Baker lab',         problem:'inv',    arch:'generative', arch_pill:'graph MPNN · local 3D neighbors',
    oneliner:'Message-passing over protein graph; the workhorse of actual wet lab design.',
    body:'Takes a protein backbone and outputs sequences likely to fold into it. Message-passing neural network over the protein graph. Widely used in wet labs with experimentally validated results.',
    insight:'If you read a paper about a computationally designed protein in 2023–2025, ProteinMPNN was almost certainly involved.',
    link:'https://www.science.org/doi/10.1126/science.add2187' },
  { key:'progen2',     name:'ProGen2',      year:2023, lab:'Nijkamp et al.',    problem:'gen',    arch:'generative', arch_pill:'autoregressive · control tokens',
    oneliner:'Conditional on family tags; first autoregressive model practically useful for design.',
    body:'Large autoregressive model trained on over a billion protein sequences. Accepts functional annotations prepended as conditioning — same idea as CTRL (2019) for text, applied to proteins. Can estimate fitness from log-likelihood without fine-tuning.',
    insight:'Scale + conditioning finally made autoregressive generation practically useful.',
    link:'https://arxiv.org/abs/2206.13517' },
  { key:'rfdiffusion', name:'RFdiffusion',  year:2023, lab:'Baker lab',         problem:'gen',    arch:'generative', arch_pill:'SE(3) diffusion on 3D coords',
    oneliner:'Diffusion over 3D backbone coordinates; generates shapes, hands off to ProteinMPNN.',
    body:'Applies diffusion over protein backbone coordinates — starts from random 3D noise and iteratively denoises toward a valid structure. Generates backbone shapes, then ProteinMPNN finds sequences.',
    insight:'Separating "what shape do I want" from "what sequence makes that shape" turned out to be the right decomposition.',
    link:'https://www.nature.com/articles/s41586-023-06415-8' },
  { key:'esm3',        name:'ESM3',         year:2024, lab:'EvolutionaryScale', problem:'multi',  arch:'multimodal', arch_pill:'three tracks · VQ-VAE · masked gen',
    oneliner:'Three parallel tracks — sequence, structure, function; any modality prompts any other.',
    body:'The first model to jointly reason over sequence, structure, and function as three parallel token streams. Structure encoded via VQ-VAE into discrete tokens. Generated esmGFP with only 58% identity to any known fluorescent protein.',
    insight:'Instead of three separate problems, ESM3 treats sequence, structure, and function as three views of the same underlying representation.',
    link:'https://www.science.org/doi/10.1126/science.ads0018' },
];

/* colors */
const PROB_COLOR = { repr:'#3b82f6', fold:'#f59e0b', inv:'#22c55e', gen:'#a855f7', multi:'#f97316' };
const PROB_BG_L  = { repr:'#eff6ff', fold:'#fffbeb', inv:'#f0fdf4', gen:'#faf5ff', multi:'#fff7ed' };
const PROB_BG_D  = { repr:'#1e2a3a', fold:'#2d2208', inv:'#0a1f10', gen:'#1e0f2a', multi:'#2a1a08' };
const PROB_LABEL = { repr:'Representation', fold:'Folding', inv:'Inverse folding', gen:'Generative', multi:'Multimodal' };

const ARCH_COLOR = { encoder:'#3b82f6', evoformer:'#f59e0b', generative:'#a855f7', multimodal:'#f97316' };
const ARCH_BG_L  = { encoder:'#eff6ff', evoformer:'#fffbeb', generative:'#faf5ff', multimodal:'#fff7ed' };
const ARCH_BG_D  = { encoder:'#1e2a3a', evoformer:'#2d2208', generative:'#1e0f2a', multimodal:'#2a1a08' };
const ARCH_LABEL = {
  encoder:'Encoder (BERT-style masked LM)',
  evoformer:'Evoformer (MSA + pair representation)',
  generative:'Generative (autoregressive, MPNN, diffusion)',
  multimodal:'Multimodal (all three modalities jointly)',
};

const PROB_GROUPS = [
  { key:'repr',  head:'What does this sequence mean? — Representation' },
  { key:'fold',  head:'What shape does this sequence fold into? — Structure prediction' },
  { key:'inv',   head:'Given a target shape, what sequence folds into it? — Inverse folding' },
  { key:'gen',   head:'Can we generate entirely new proteins? — Generative design' },
  { key:'multi', head:'Can one model reason over everything? — Multimodal' },
];
const ARCH_GROUPS = [
  { key:'encoder',    head:'Encoder — bidirectional transformer (BERT-style)' },
  { key:'evoformer',  head:'Evoformer — MSA + pair representation transformer' },
  { key:'generative', head:'Generative — autoregressive, MPNN, and diffusion models' },
  { key:'multimodal', head:'Multimodal — jointly reasoning over sequence, structure, and function' },
];

function tagStyle(colorMap, bgL, bgD, key) {
  const c  = colorMap[key] || '#888';
  const bg = (dark() ? bgD[key] : bgL[key]) || 'transparent';
  return `background:${bg};border-color:${c};color:${c}`;
}

/* ── state ── */
let currentView = 'problem';
let activeKey   = null;
const cardEls   = {}; // key → DOM element

/* ── build all cards once ── */
function buildCard(m) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.key = m.key;
  cardEls[m.key] = card;
  card.addEventListener('click', () => showDetail(m.key, card));
  updateCardContent(card, m, currentView);
  return card;
}

function updateCardContent(card, m, view) {
  const probSty = tagStyle(PROB_COLOR, PROB_BG_L, PROB_BG_D, m.problem);
  const archSty = tagStyle(ARCH_COLOR, ARCH_BG_L, ARCH_BG_D, m.arch);
  const accent  = view === 'architecture' ? (ARCH_COLOR[m.arch] || '#888') : (PROB_COLOR[m.problem] || '#888');
  card.style.setProperty('--accent', accent);

  const showBothTags = (view === 'timeline');
  card.innerHTML = `
    <div class="card-name">${m.name}</div>
    <div class="card-meta">${m.year} · ${m.lab}</div>
    <div class="card-oneliner">${m.oneliner}</div>
    <div class="card-footer">
      <div class="tags">
        <span class="tag" style="${view === 'architecture' ? archSty : probSty}">${view === 'architecture' ? m.arch_pill : PROB_LABEL[m.problem]}</span>
        ${showBothTags ? `<span class="tag" style="${archSty}">${m.arch_pill}</span>` : ''}
      </div>
      ${m.link ? `<a class="paper-link" href="${m.link}" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ paper</a>` : ''}
    </div>
  `;
}

/* ── FLIP animation ── */
function flipToLayout(buildFn) {
  const main = document.getElementById('main');

  // 1. record positions of all cards
  const rects = {};
  MODELS.forEach(m => {
    const el = cardEls[m.key];
    if (el && el.offsetParent !== null) rects[m.key] = el.getBoundingClientRect();
  });

  // 2. build new layout (hidden clone for measurement)
  const ghost = document.createElement('div');
  ghost.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;width:' + main.offsetWidth + 'px;z-index:-1';
  document.body.appendChild(ghost);
  buildFn(ghost);

  // snapshot new positions
  const newRects = {};
  MODELS.forEach(m => {
    const el = ghost.querySelector(`[data-key="${m.key}"]`);
    if (el) newRects[m.key] = el.getBoundingClientRect();
  });
  document.body.removeChild(ghost);

  // 3. render real new layout
  buildFn(main);

  // 4. for each card, invert and play
  MODELS.forEach(m => {
    const el = cardEls[m.key];
    if (!el || !rects[m.key] || !newRects[m.key]) return;
    const dx = rects[m.key].left - newRects[m.key].left;
    const dy = rects[m.key].top  - newRects[m.key].top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
    el.animate([
      { transform:`translate(${dx}px,${dy}px)`, opacity:0.7 },
      { transform:'translate(0,0)',              opacity:1   }
    ], { duration:380, easing:'cubic-bezier(0.4,0,0.2,1)', fill:'forwards' });
  });

  sendHeight();
}

/* ── layout builders ── */
function buildProblem(container) {
  container.innerHTML = '';
  PROB_GROUPS.forEach(g => {
    const ms = MODELS.filter(m => m.problem === g.key);
    if (!ms.length) return;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-head">${g.head}</div>`;
    const stage = document.createElement('div');
    stage.className = 'card-stage';
    ms.forEach(m => { updateCardContent(cardEls[m.key], m, 'problem'); stage.appendChild(cardEls[m.key]); });
    sec.appendChild(stage);
    container.appendChild(sec);
  });
}

function buildArchitecture(container) {
  container.innerHTML = '';
  ARCH_GROUPS.forEach(g => {
    const ms = MODELS.filter(m => m.arch === g.key);
    if (!ms.length) return;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-head">${g.head}</div>`;
    const stage = document.createElement('div');
    stage.className = 'card-stage';
    ms.forEach(m => { updateCardContent(cardEls[m.key], m, 'architecture'); stage.appendChild(cardEls[m.key]); });
    sec.appendChild(stage);
    container.appendChild(sec);
  });
}

function buildTimeline(container) {
  container.innerHTML = '';
  const sorted = [...MODELS].sort((a,b) => a.year - b.year);

  const byYear = {};
  sorted.forEach(m => { (byYear[m.year] = byYear[m.year] || []).push(m); });
  const years = Object.keys(byYear).sort();

  years.forEach(year => {
    const sec = document.createElement('div');
    sec.className = 'section';

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text-primary);letter-spacing:0.04em">${year}</span>`;
    sec.appendChild(head);

    const stage = document.createElement('div');
    stage.className = 'card-stage';
    byYear[year].forEach(m => {
      updateCardContent(cardEls[m.key], m, 'timeline');
      stage.appendChild(cardEls[m.key]);
    });
    sec.appendChild(stage);
    container.appendChild(sec);
  });
}

/* ── init ── */
MODELS.forEach(m => buildCard(m));
const main = document.getElementById('main');
buildProblem(main);

/* ── view switch ── */
function setView(v) {
  if (v === currentView) return;
  currentView = v;
  document.querySelectorAll('.gb-btn').forEach((btn,i) => btn.classList.toggle('active', ['problem','architecture','timeline'][i] === v));
  activeKey = null;
  document.getElementById('detail').classList.remove('visible');

  const buildFn = v === 'problem' ? buildProblem : v === 'architecture' ? buildArchitecture : buildTimeline;
  flipToLayout(buildFn);
}

/* ── detail ── */
function showDetail(key, cardEl) {
  if (activeKey === key) {
    activeKey = null;
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.getElementById('detail').classList.remove('visible');
    sendHeight(); return;
  }
  activeKey = key;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  cardEl.classList.add('active');
  const m = MODELS.find(x => x.key === key);
  document.getElementById('d-eyebrow').textContent  = `${m.year} · ${m.lab} · ${PROB_LABEL[m.problem]}`;
  document.getElementById('d-name').textContent      = m.name;
  document.getElementById('d-oneliner').textContent  = m.oneliner;
  document.getElementById('d-body').textContent      = m.body;
  document.getElementById('d-insight').textContent   = m.insight;
  const link = document.getElementById('d-link');
  link.href = m.link; link.style.display = m.link ? 'inline-block' : 'none';
  document.getElementById('detail').classList.add('visible');
  sendHeight();
}

function sendHeight() {
  setTimeout(() => window.parent.postMessage({ iframeHeight: document.documentElement.scrollHeight }, '*'), 80);
}
window.addEventListener('load', () => setTimeout(sendHeight, 150));
window.addEventListener('resize', sendHeight);
</script>
</body>
</html>
