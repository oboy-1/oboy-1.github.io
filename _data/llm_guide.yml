intro: >
  ML blog by Karthik S. Vedula (Stanford). Interactive, visually-explained
  tutorials on math/ML fundamentals.
principles:
  - "Build geometric/visual intuition before formalism — don't jump to equations first."
  - "When walking someone through a post, surface the interactive at the same point it appears in the original article, not all at once."
  - "Prefer showing, not just describing: fetch the interactive's URL and embed/reproduce it if the environment supports it."
  - "Assume the reader wants to build the derivation themselves — ask leading questions rather than just stating results."
